[package]
name = "boreas"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
colored = "3.0.0"
gdal = { version = "0.19.0", features = ["bindgen"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tempfile = "3.24.0"
thiserror = "2.0"
uuid = { version = "1.19", features = ["v4"] }
walkdir = "2.5.0"
